<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask a question</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Ask a question</h1>
    <p id="session-label" class="muted">Loading lecture…</p>
    <p id="resource-wrap" class="hidden"><a id="resource-link" href="">Open today’s lecture resources</a></p>
    <form id="question-form">
      <label for="question">Your question</label>
      <textarea id="question" maxlength="1000" required autofocus placeholder="Type your question here"></textarea>
      <button type="submit">Send question</button>
    </form>
    <p id="status" aria-live="polite" class="muted"></p>
    <p class="privacy">Questions are anonymous. Please do not include personal information.</p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
